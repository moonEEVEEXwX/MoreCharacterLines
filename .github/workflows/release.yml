name: Release

# 打 tag（例如 v0.1.1）→ 从源码编译 + 打包 → 建 GitHub Release。
# 发布时机由你决定：什么时候打 tag（并在需要时自己 push），什么时候发版。

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write          # 建 Release 需要

jobs:
  release:
    name: 编译打包并创建 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译 + 打包（tag 与 mod_manifest.json 的 version 不一致会直接失败）
        uses: ./.github/actions/build-mod
        with:
          expect-version: ${{ github.ref_name }}

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "更多角色台词 $GITHUB_REF_NAME" \
            --generate-notes
          echo "Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
